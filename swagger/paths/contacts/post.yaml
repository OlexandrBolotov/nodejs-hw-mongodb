tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phoneNumber:
            type: string
          contactType:
            type: string
            enum: [personal, work, other]
          isFavourite:
            type: boolean
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Invalid input data
  '401':
    description: Unauthorized – missing or invalid token
