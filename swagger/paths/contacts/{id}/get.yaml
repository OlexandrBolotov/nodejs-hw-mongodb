tags:
  - Contacts
summary: Get contact by id
operationId: getContactById
description: Retrieve a contact by its id
security:
  - bearerAuth: []
parameters:
  - $ref: ../../../components/parameters/contactId.yaml
responses:
  '200':
    description: Successful operation
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact
            data:
              $ref: ../../../components/schemas/Contact.yaml
  '404':
    $ref: ../../../components/responses/NotFound.yaml
    '401':
    description: Unauthorized – missing or invalid token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
            message:
              type: string
            data:
              type: string
    
    